server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    client_max_body_size 20M;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # الواجهة والـ API على نفس الأصل — لا CORS ولا تعديل في شيفرة العميل
    location /api/ {
        proxy_pass http://shefaa-backend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # شاشة النداء تعتمد SSE — يجب تعطيل التخزين المؤقت وإبقاء الاتصال مفتوحاً
    location = /api/public/clinic/display-stream {
        proxy_pass http://shefaa-backend:80;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 24h;
        chunked_transfer_encoding off;
    }

    location /uploads/ {
        proxy_pass http://shefaa-backend:80;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # أصول Vite مبصومة بالمحتوى — تُخزَّن طويلاً
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # مقاطع النداء الصوتية: تُحمَّل كلها عند فتح الشاشة (نحو 40 ملفاً) فتخزينها
    # يوفّر إعادة تحميلها بعد كل إعادة تشغيل. أسبوع لا سنة: التسجيلات تُستبدل
    # بأسمائها نفسها (لا بصمة محتوى فيها)، فالسنة تُجمّد نسخةً معيبة عند الجهاز.
    location /audio/ {
        expires 7d;
        add_header Cache-Control "public";
    }

    # ═══ الرابط القصير لجهاز الشاشة ═══
    # يكتب الموظف dashboard-shefaa.abukm.com/s بريموت التلفزيون، فيوجّهه الخادم
    # إلى /display?key=… بالرمز كاملاً. الرمز **لا يُكتب هنا**: nginx لا يقرأ بيئة
    # الحاوية الخلفية، وكتابته في هذا الملف تعني دخوله المستودع. فنمرّر الطلب
    # للخادم (الذي يملك DISPLAY_KEY) وهو يردّ بالتوجيه.
    # `=` مطابقة تامة: لا تبتلع /something الذي تحتاجه الواجهة.
    location = /s {
        proxy_pass http://shefaa-backend:80/api/s;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA — كل مسار غير موجود يعود إلى index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
